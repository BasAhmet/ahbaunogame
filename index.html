<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO - Pass and Play</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tıklama hissi için küçük bir animasyon */
        .btn-press:active { transform: scale(0.95); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800 flex items-center justify-center">

    <div id="app" class="w-full max-w-md bg-white min-h-[600px] shadow-xl rounded-xl p-6 flex flex-col relative overflow-hidden">
        
        <!-- Başlangıç Ekranı -->
        <div id="startScreen" class="flex flex-col h-full justify-center items-center">
            <h1 class="text-6xl font-extrabold mb-2"><span class="text-red-500">U</span><span class="text-blue-500">N</span><span class="text-yellow-500">O</span></h1>
            <p class="text-gray-500 mb-8 font-medium">Pass and Play Edition</p>
            
            <p class="text-lg font-semibold mb-4 text-gray-700">Oyuncu Sayısını Seçin:</p>
            <div class="grid grid-cols-5 gap-2 w-full mb-8">
                <button class="player-btn bg-gray-200 text-gray-800 py-3 rounded-lg font-bold btn-press hover:bg-gray-300" data-players="2">2</button>
                <button class="player-btn bg-gray-200 text-gray-800 py-3 rounded-lg font-bold btn-press hover:bg-gray-300" data-players="3">3</button>
                <button class="player-btn bg-gray-200 text-gray-800 py-3 rounded-lg font-bold btn-press hover:bg-gray-300" data-players="4">4</button>
                <button class="player-btn bg-gray-200 text-gray-800 py-3 rounded-lg font-bold btn-press hover:bg-gray-300" data-players="5">5</button>
                <button class="player-btn bg-gray-200 text-gray-800 py-3 rounded-lg font-bold btn-press hover:bg-gray-300" data-players="6">6</button>
            </div>
            
            <button id="startGameBtn" class="w-full bg-black text-white py-4 rounded-xl font-bold text-lg btn-press transition-transform opacity-50 cursor-not-allowed" disabled>
                Oyunu Başlat
            </button>
        </div>

        <!-- Devretme (Pass) Ekranı -->
        <div id="passScreen" class="hidden flex-col h-full justify-center items-center text-center">
            <h2 id="turnText" class="text-4xl font-bold mb-4 text-gray-800">Sıra: Oyuncu 1</h2>
            <p class="text-gray-500 mb-8 font-medium">Telefonu alın ve hazır olduğunuzda butona basın. Diğer oyuncuların ekrana bakmadığından emin olun!</p>
            <button id="showCardsBtn" class="w-full bg-blue-500 text-white py-4 rounded-xl font-bold text-lg btn-press">
                Kartlarımı Göster
            </button>
        </div>

        <!-- Oyun Ekranı -->
        <div id="gameScreen" class="hidden flex-col h-full relative">
            <div class="text-center font-bold text-lg border-b pb-2 mb-4 text-gray-700" id="currentPlayerName">Oyuncu 1</div>
            
            <!-- Masadaki Kartlar -->
            <div class="flex justify-center gap-4 mb-6">
                <!-- Deste -->
                <div id="drawCardBtn" class="w-24 h-36 bg-gray-800 rounded-xl border-4 border-gray-300 shadow-md flex items-center justify-center cursor-pointer btn-press">
                    <span class="text-white font-bold transform -rotate-45 text-xl">UNO</span>
                </div>
                <!-- Ortadaki Açık Kart -->
                <div id="topCard" class="w-24 h-36 rounded-xl border-4 border-white shadow-lg flex items-center justify-center text-4xl text-white font-extrabold text-center drop-shadow-md">
                    <!-- JS ile dolacak -->
                </div>
            </div>

            <!-- Oyuncunun Eli -->
            <div class="flex-1 overflow-y-auto">
                <p class="text-sm text-gray-500 mb-2 font-semibold">Senin Kartların:</p>
                <div id="playerHand" class="grid grid-cols-3 gap-3 pb-20">
                    <!-- JS ile dolacak -->
                </div>
            </div>

            <!-- Hamle Bitirme -->
            <div class="absolute bottom-0 left-0 w-full bg-white pt-2">
                 <button id="endTurnBtn" class="w-full bg-green-500 text-white py-4 rounded-xl font-bold text-lg btn-press">
                    Hamleyi Bitir
                </button>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
