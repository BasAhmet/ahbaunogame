<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO - Pass and Play</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tıklama hissi için küçük bir animasyon */
        .btn-press:active { transform: scale(0.95); }
        
        /* Kaydırma çubuğunun daha zarif görünmesi için (İsteğe bağlı) */
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800 flex items-center justify-center p-4">

    <!-- UYGULAMA PENCERESİ: Yükseklik sınırlandırıldı (h-[95vh]) böylece içindeki alanlar doğru şekilde kaydırılabilir -->
    <div id="app" class="w-full max-w-md md:max-w-3xl lg:max-w-5xl bg-white h-[95vh] md:h-[85vh] min-h-[600px] shadow-xl rounded-xl p-4 md:p-8 flex flex-col relative">
        
        <!-- Başlangıç Ekranı -->
        <div id="startScreen" class="flex flex-col h-full justify-center items-center">
            <h1 class="text-7xl md:text-8xl font-extrabold mb-2"><span class="text-red-500">U</span><span class="text-blue-500">N</span><span class="text-yellow-500">O</span></h1>
            <p class="text-gray-500 mb-8 font-medium text-lg">Pass and Play Edition</p>
            
            <p class="text-lg font-semibold mb-4 text-gray-700">Oyuncu Sayısını Seçin:</p>
            
            <div class="grid grid-cols-5 gap-2 w-full max-w-md mb-8">
                <button class="player-btn bg-gray-200 text-gray-800 py-3 rounded-lg font-bold btn-press hover:bg-gray-300" data-players="2">2</button>
                <button class="player-btn bg-gray-200 text-gray-800 py-3 rounded-lg font-bold btn-press hover:bg-gray-300" data-players="3">3</button>
                <button class="player-btn bg-gray-200 text-gray-800 py-3 rounded-lg font-bold btn-press hover:bg-gray-300" data-players="4">4</button>
                <button class="player-btn bg-gray-200 text-gray-800 py-3 rounded-lg font-bold btn-press hover:bg-gray-300" data-players="5">5</button>
                <button class="player-btn bg-gray-200 text-gray-800 py-3 rounded-lg font-bold btn-press hover:bg-gray-300" data-players="6">6</button>
            </div>
            
            <button id="startGameBtn" class="w-full max-w-md bg-black text-white py-4 rounded-xl font-bold text-lg btn-press transition-transform opacity-50 cursor-not-allowed" disabled>
                Oyunu Başlat
            </button>
        </div>

        <!-- Devretme (Pass) Ekranı -->
        <div id="passScreen" class="hidden flex-col h-full justify-center items-center text-center">
            <h2 id="turnText" class="text-5xl font-bold mb-4 text-gray-800">Sıra: Oyuncu 1</h2>
            <p class="text-gray-500 mb-8 font-medium text-lg">Cihazı alın ve hazır olduğunuzda butona basın. Diğer oyuncuların ekrana bakmadığından emin olun!</p>
            <button id="showCardsBtn" class="w-full max-w-md bg-blue-500 text-white py-4 rounded-xl font-bold text-lg btn-press">
                Kartlarımı Göster
            </button>
        </div>

        <!-- OYUN EKRANI (3 Katmanlı Yapı) -->
        <div id="gameScreen" class="hidden flex-col h-full w-full">
            
            <!-- 1. ÜST KATMAN: Masadaki Kartlar (shrink-0 ile küçülmesi engellendi) -->
            <div class="shrink-0">
                <div class="text-center font-bold text-xl border-b pb-3 mb-4 text-gray-700" id="currentPlayerName">Oyuncu 1</div>
                <div class="flex justify-center gap-8 mb-4">
                    <div id="drawCardBtn" class="w-24 h-36 md:w-28 md:h-40 bg-gray-800 rounded-xl border-4 border-gray-300 shadow-md flex items-center justify-center cursor-pointer btn-press">
                        <span class="text-white font-bold transform -rotate-45 text-xl md:text-2xl">UNO</span>
                    </div>
                    <div id="topCard" class="w-24 h-36 md:w-28 md:h-40 rounded-xl border-4 border-white shadow-lg flex items-center justify-center text-4xl md:text-5xl text-white font-extrabold text-center drop-shadow-md">
                        <!-- JS ile dolacak -->
                    </div>
                </div>
            </div>

            <!-- 2. ORTA KATMAN: Oyuncunun Eli (overflow-y-auto ile kendi içinde aşağı kaydırılabilir) -->
            <div class="flex-1 w-full overflow-y-auto px-1">
                <div id="playerHand" class="w-full pb-2">
                    <!-- JS ile dolacak -->
                </div>
            </div>

            <!-- 3. ALT KATMAN: Butonlar (Absolute kaldırıldı, kartların üzerine taşmaz) -->
            <div class="shrink-0 w-full bg-white pt-4 pb-1 flex flex-col items-center justify-center border-t mt-2">
                 <button id="endTurnBtn" class="w-full max-w-md bg-green-500 text-white py-4 rounded-xl font-bold text-lg btn-press shadow-lg">
                    Hamleyi Bitir
                </button>
            </div>
            
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
