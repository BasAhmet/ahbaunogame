<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO Oyunu - Mod Seçimi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center font-sans px-4">

    <div class="max-w-md w-full bg-white p-8 md:p-10 rounded-[2rem] shadow-2xl flex flex-col items-center gap-6 text-center border-8 border-gray-800 relative overflow-hidden">
        
        <!-- Arka Plan Süslemeleri -->
        <div class="absolute -top-10 -left-10 w-32 h-32 bg-red-500 rounded-full mix-blend-multiply filter blur-2xl opacity-50"></div>
        <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-blue-500 rounded-full mix-blend-multiply filter blur-2xl opacity-50"></div>

        <!-- Başlık -->
        <div class="relative z-10 mb-4">
            <h1 class="text-7xl font-black text-transparent bg-clip-text bg-gradient-to-br from-red-600 via-yellow-500 to-green-500 drop-shadow-xl tracking-tighter">
                UNO
            </h1>
            <span class="bg-blue-600 text-white font-bold text-sm px-3 py-1 rounded-full absolute -bottom-4 right-0 transform rotate-12 shadow-md">
                Çoklu Oyuncu
            </span>
        </div>
        
        <p class="text-gray-600 font-black mb-2 text-lg tracking-wide z-10">Nasıl oynamak istersin?</p>

        <!-- Offline Butonu -->
        <a href="offline.html" class="w-full bg-gradient-to-r from-green-500 to-green-700 hover:from-green-600 hover:to-green-800 hover:scale-105 active:scale-95 text-white font-black py-5 rounded-2xl shadow-[0_10px_20px_rgba(34,197,94,0.3)] border-b-4 border-green-800 transition-all text-xl flex items-center justify-center gap-4 z-10">
            <span class="text-4xl drop-shadow-md">🎮</span> 
            <span>Aynı Cihazda<br><span class="text-sm text-green-200 font-semibold">(Yan Yana Oyna)</span></span>
        </a>

        <!-- Online Butonu -->
        <a href="online.html" class="w-full bg-gradient-to-r from-blue-500 to-blue-700 hover:from-blue-600 hover:to-blue-800 hover:scale-105 active:scale-95 text-white font-black py-5 rounded-2xl shadow-[0_10px_20px_rgba(59,130,246,0.3)] border-b-4 border-blue-800 transition-all text-xl flex items-center justify-center gap-4 z-10">
            <span class="text-4xl drop-shadow-md">🌐</span> 
            <span>Farklı Cihazlarda<br><span class="text-sm text-blue-200 font-semibold">(Oda Kur / Katıl)</span></span>
        </a>

    </div>

</html>
