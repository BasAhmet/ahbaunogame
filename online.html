<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO - Pass and Play</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tıklama hissi için küçük bir animasyon */
        .btn-press:active { transform: scale(0.95); }
        
        /* Sadece yatay kaydırma çubuğu için ince ve şık görünüm */
        ::-webkit-scrollbar { height: 10px; width: 0px; } /* Genişlik 0 yapıldı ki dikey çubuk çıksa bile görünmesin */
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800 flex items-center justify-center py-8 px-4">

    <!-- UYGULAMA PENCERESİ: Sabit yükseklik tamamen kaldırıldı. İçerik ne kadarsa o kadar uzayacak -->
    <div id="app" class="w-full max-w-md md:max-w-3xl lg:max-w-5xl bg-white min-h-[600px] shadow-2xl rounded-2xl p-6 md:p-10 flex flex-col relative">
        
        <!-- YENİ BAŞLANGIÇ EKRANI (LOBİ) -->
        <div id="startScreen" class="flex flex-col items-center justify-center min-h-screen bg-gray-900 px-4 z-50 absolute inset-0 w-full">
            <h1 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-red-500 to-blue-500 mb-8 drop-shadow-xl text-center">UNO<br><span class="text-3xl text-white">Online</span></h1>
            <!-- Avatar Seçim Alanı -->
            <div class="w-full mb-6">
                <p class="text-gray-700 font-bold mb-2 text-center">Avatarını Seç!</p>
                <div id="avatarContainer" class="flex flex-wrap justify-center gap-3">
                    <button onclick="selectAvatar('🐶', this)" class="avatar-btn w-12 h-12 text-3xl bg-white border-2 border-gray-200 rounded-xl hover:scale-110 hover:border-yellow-400 transition-all cursor-pointer">🐶</button>
                    <button onclick="selectAvatar('🐱', this)" class="avatar-btn w-12 h-12 text-3xl bg-white border-2 border-gray-200 rounded-xl hover:scale-110 hover:border-yellow-400 transition-all cursor-pointer">🐱</button>
                    <button onclick="selectAvatar('🦊', this)" class="avatar-btn w-12 h-12 text-3xl bg-white border-2 border-gray-200 rounded-xl hover:scale-110 hover:border-yellow-400 transition-all cursor-pointer">🦊</button>
                    <button onclick="selectAvatar('🐼', this)" class="avatar-btn w-12 h-12 text-3xl bg-white border-2 border-gray-200 rounded-xl hover:scale-110 hover:border-yellow-400 transition-all cursor-pointer">🐼</button>
                    <button onclick="selectAvatar('🐸', this)" class="avatar-btn w-12 h-12 text-3xl bg-white border-2 border-gray-200 rounded-xl hover:scale-110 hover:border-yellow-400 transition-all cursor-pointer">🐸</button>
                    <button onclick="selectAvatar('🦄', this)" class="avatar-btn w-12 h-12 text-3xl bg-white border-2 border-gray-200 rounded-xl hover:scale-110 hover:border-yellow-400 transition-all cursor-pointer">🦄</button>
                </div>
            </div>
            <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full flex flex-col gap-6">
                <!-- Kendi İsmini Girme -->
                <div>
                    <label class="block text-gray-700 font-bold mb-2 text-sm uppercase tracking-wider">Oyuncu Adın:</label>
                    <input type="text" id="playerNameInput" placeholder="Adını gir..." class="w-full border-2 border-gray-300 p-3 rounded-xl font-bold text-center text-lg focus:border-blue-500 outline-none transition-colors">
                </div>
        
                <hr class="border-gray-200">
        
                <!-- Oda Kurma -->
                <button id="createRoomBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg transition-transform active:scale-95 text-lg">
                    Yeni Oda Kur
                </button>
                
                <div class="text-center text-gray-400 font-black text-sm uppercase tracking-widest relative">
                    <span class="bg-white px-2 relative z-10">VEYA</span>
                    <div class="absolute w-full h-[2px] bg-gray-200 top-1/2 left-0 transform -translate-y-1/2 z-0"></div>
                </div>
        
                <!-- Odaya Katılma -->
                <div class="flex flex-col gap-2">
                    <input type="text" id="roomPinInput" placeholder="Oda PIN Kodu" class="w-full border-2 border-gray-300 p-3 rounded-xl font-black text-center text-xl uppercase tracking-widest focus:border-green-500 outline-none transition-colors" maxlength="6">
                    <button id="joinRoomBtn" class="w-full bg-green-500 hover:bg-green-600 text-white font-black py-4 rounded-xl shadow-lg transition-transform active:scale-95 text-lg">
                        Odaya Katıl
                    </button>
                </div>
            </div>
        </div>

        <!-- Devretme (Pass) Ekranı -->
        <div id="passScreen" class="hidden flex-col h-full justify-center items-center text-center flex-1">
            <h2 id="turnText" class="text-5xl font-bold mb-4 text-gray-800">Sıra: Oyuncu 1</h2>
            <p class="text-gray-500 mb-8 font-medium text-lg">Cihazı alın ve hazır olduğunuzda butona basın. Diğer oyuncuların ekrana bakmadığından emin olun!</p>
            <button id="showCardsBtn" class="w-full max-w-md bg-blue-500 text-white py-4 rounded-xl font-bold text-lg btn-press">
                Kartlarımı Göster
            </button>
        </div>

        <!-- OYUN EKRANI -->
        <div id="gameScreen" class="hidden flex-col h-full w-full flex-1">
            
            <!-- Masadaki Kartlar -->
            <div class="text-center font-bold text-xl border-b pb-3 mb-6 text-gray-700" id="currentPlayerName">Oyuncu 1</div>
            <div class="flex justify-center gap-8 mb-6">
                <div id="drawCardBtn" class="w-24 h-36 md:w-28 md:h-40 bg-gray-800 rounded-xl border-4 border-gray-300 shadow-md flex items-center justify-center cursor-pointer btn-press">
                    <span class="text-white font-bold transform -rotate-45 text-xl md:text-2xl">UNO</span>
                </div>
                <div id="topCard" class="w-24 h-36 md:w-28 md:h-40 rounded-xl border-4 border-white shadow-lg flex items-center justify-center text-4xl md:text-5xl text-white font-extrabold text-center drop-shadow-md">
                    <!-- JS ile dolacak -->
                </div>
            </div>

            <!-- Oyuncunun Eli (Doğal akışta, dikey sınırlandırma yok) -->
            <div id="playerHand" class="w-full mb-8">
                <!-- JS ile dolacak -->
            </div>

            <!-- Hamle Butonları (Absolute değil, sayfanın akışında en alta mt-auto ile itildi) -->
            <div class="mt-auto w-full flex flex-col items-center justify-center border-t border-gray-200 pt-6">
                 <button id="endTurnBtn" class="w-full max-w-md bg-green-500 text-white py-4 rounded-xl font-bold text-lg btn-press shadow-lg">
                    Hamleyi Bitir
                </button>
            </div>
            
        </div>

    </div>
    <!-- Renk Seçim Modalı -->
    <div id="colorModal" class="hidden fixed inset-0 bg-white/80 z-50 items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-8 rounded-3xl shadow-2xl flex flex-col items-center gap-6 border-4 border-yellow-300 transform transition-all">
            <h2 class="text-3xl font-black text-gray-800 tracking-wide text-center">Renk Seç!</h2>
            <div class="grid grid-cols-2 gap-6">
                <button onclick="selectColor('red')" class="w-24 h-24 bg-red-500 rounded-2xl shadow-lg border-4 border-red-200 hover:scale-110 active:scale-95 transition-transform cursor-pointer"></button>
                <button onclick="selectColor('blue')" class="w-24 h-24 bg-blue-500 rounded-2xl shadow-lg border-4 border-blue-200 hover:scale-110 active:scale-95 transition-transform cursor-pointer"></button>
                <button onclick="selectColor('green')" class="w-24 h-24 bg-green-500 rounded-2xl shadow-lg border-4 border-green-200 hover:scale-110 active:scale-95 transition-transform cursor-pointer"></button>
                <button onclick="selectColor('yellow')" class="w-24 h-24 bg-yellow-400 rounded-2xl shadow-lg border-4 border-yellow-100 hover:scale-110 active:scale-95 transition-transform cursor-pointer"></button>
            </div>
        </div>
    </div>

    <script type="module" src="online.js"></script>
</body>
</html>
